[package]
name = "resona-player"
version = "0.1.0"
description = "Reson\u00e1 - Tauri v2 + Rust"
authors = ["you"]
edition = "2021"

[lib]
name = "resona_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
tauri-plugin-autostart = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
discord-rich-presence = "0.2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
maudio = "0.1"
lofty = "0.22"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "sqlite"] }
uuid = { version = "1", features = ["v4"] }
chrono = "0.4"
base64 = "0.22"
md-5 = "0.10"
log = "0.4"
env_logger = "0.11"
walkdir = "2"
reqwest = { version = "0.12", features = ["json", "blocking"] }
tiny_http = "0.12"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

# Performance optimizations
rayon = "1.10"
dashmap = "6.0"
moka = { version = "0.12", features = ["future"] }

# Full-text search (Phase 2)
tantivy = "0.22"

# LUFS normalization (Phase 2)
# Note: loudness-rs is not available, using eburon instead
eburon = "0.1"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "aac", "flac", "wav", "ogg", "pcm", "isomp4"] }

# Windows-specific APIs (Phase 3 - GPU & Native Integration)
[target.'cfg(windows)'.dependencies.windows]
version = "0.58"
features = [
    # Core Foundation
    "Win32_Foundation",
    "Win32_System_Com",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_System_Variant",
    "Win32_System_Ole",
    
    # Shell Integration (Taskbar, Jump Lists)
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    
    # Direct2D/DirectWrite for GPU-accelerated rendering
    "Win32_Graphics_Direct2D",
    "Win32_Graphics_Direct2D_Common",
    "Win32_Graphics_DirectWrite",
    "Win32_Graphics_Imaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Dxgi_Common",
    
    # Media Foundation for hardware-accelerated decoding
    "Win32_Media_MediaFoundation",
    "Win32_Media_Multimedia",
    
    # Power management
    "Win32_System_Power",
]

# GPU compute for image processing (Intel Iris Xe)
[target.'cfg(windows)'.dependencies]
wgpu = "22"
pollster = "0.3"

[package.metadata]
